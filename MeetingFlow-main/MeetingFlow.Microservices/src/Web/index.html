<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetingFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
        header h1 { font-size: 1.25rem; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; background: white; border-right: 1px solid #ddd; overflow-y: auto; padding: 1rem; }
        .sidebar h2 { font-size: 0.9rem; color: #666; margin-bottom: 0.5rem; text-transform: uppercase; }
        .meeting-card { padding: 0.75rem; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; transition: background 0.2s; }
        .meeting-card:hover { background: #f0f0ff; }
        .meeting-card h3 { font-size: 0.9rem; margin-bottom: 0.25rem; }
        .meeting-card p { font-size: 0.75rem; color: #666; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 1rem 2rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .msg { max-width: 70%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
        .msg.user { align-self: flex-end; background: #1a1a2e; color: white; }
        .msg.assistant { align-self: flex-start; background: white; border: 1px solid #ddd; }
        .msg pre { background: #f5f5f5; padding: 0.5rem; border-radius: 4px; margin-top: 0.5rem; font-size: 0.8rem; overflow-x: auto; }
        .chat-input { display: flex; gap: 0.5rem; padding: 1rem 2rem; border-top: 1px solid #ddd; background: white; }
        .chat-input input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; }
        .chat-input button { padding: 0.75rem 1.5rem; background: #1a1a2e; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .chat-input button:hover { background: #16213e; }
        .data-panel { margin-top: 0.5rem; background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 6px; padding: 0.5rem; font-size: 0.8rem; }
        .task-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
        .task-item.completed { text-decoration: line-through; color: #999; }
    </style>
</head>
<body>
    <header>
        <h1>MeetingFlow</h1>
        <span style="color: #aaa; font-size: 0.8rem;">AI-powered meeting assistant</span>
    </header>
    <div class="container">
        <aside class="sidebar">
            <h2>Meetings</h2>
            <div id="meetings-list"><p style="color:#999;font-size:0.8rem;">Loading...</p></div>
        </aside>
        <main class="main">
            <div class="chat-messages" id="chat-messages">
                <div class="msg assistant">
                    Hi! I'm the MeetingFlow assistant. I can help you manage meetings and tasks.<br><br>
                    Try: <em>"list meetings"</em>, <em>"add task 'Review budget' for &lt;meetingId&gt;"</em>, or <em>"show tasks"</em>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Ask about meetings, tasks, or registrations..." />
                <button id="send-btn">Send</button>
            </div>
        </main>
    </div>
    <script>
        const API = window.location.port === '3000' ? '/api' : 'http://localhost:8080';
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const meetingsList = document.getElementById('meetings-list');
        let history = [];

        async function loadMeetings() {
            try {
                const resp = await fetch(`${API}/meetings`);
                const meetings = await resp.json();
                meetingsList.innerHTML = meetings.map(m => `
                    <div class="meeting-card" onclick="askAbout('${m.id}')">
                        <h3>${escapeHtml(m.title)}</h3>
                        <p>${new Date(m.startsAt).toLocaleDateString()} &bull; ${escapeHtml(m.status)}</p>
                    </div>
                `).join('');
            } catch {
                meetingsList.innerHTML = '<p style="color:#999;font-size:0.8rem;">Could not load meetings</p>';
            }
        }

        function askAbout(meetingId) {
            chatInput.value = `show tasks for ${meetingId}`;
            sendMessage();
        }

        async function sendMessage() {
            const msg = chatInput.value.trim();
            if (!msg) return;
            chatInput.value = '';
            appendMessage('user', msg);
            history.push({ role: 'user', content: msg });

            try {
                const resp = await fetch(`${API}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, history: history.slice(-10) })
                });
                const result = await resp.json();
                let content = result.reply;
                if (result.data) {
                    content += renderData(result.data, result.action?.type);
                }
                appendMessage('assistant', content);
                history.push({ role: 'assistant', content: result.reply });
                if (result.action?.type === 'list_meetings') loadMeetings();
            } catch (err) {
                appendMessage('assistant', 'Sorry, I could not reach the server. Is docker-compose running?');
            }
        }

        function renderData(data, actionType) {
            if (!data) return '';
            if (Array.isArray(data) && data.length === 0) return '<div class="data-panel">No items found.</div>';
            if (Array.isArray(data)) {
                if (actionType === 'list_meetings') {
                    return '<div class="data-panel">' + data.map(m =>
                        `<div class="meeting-card"><h3>${escapeHtml(m.title)}</h3><p>${m.id}</p></div>`
                    ).join('') + '</div>';
                }
                if (actionType === 'list_tasks') {
                    return '<div class="data-panel">' + data.map(t =>
                        `<div class="task-item ${t.isCompleted ? 'completed' : ''}">${escapeHtml(t.title)} ${t.assignedTo ? '(' + escapeHtml(t.assignedTo) + ')' : ''}</div>`
                    ).join('') + '</div>';
                }
                return `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            if (typeof data === 'object') {
                return `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            return '';
        }

        function appendMessage(role, content) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerHTML = content;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        loadMeetings();
    </script>
</body>
</html>
